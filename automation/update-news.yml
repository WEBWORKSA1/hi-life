name: Update life news
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python automation/fetch_news.py
      - name: Commit if changed
        run: |
          git config user.name "hi-life-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/data/news.json
          git diff --cached --quiet || git commit -m "Daily news refresh"
          git push
